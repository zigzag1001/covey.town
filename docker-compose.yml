services:
  townservice:
    build:
      context: .
      dockerfile: Dockerfile.townService
    environment:
      PORT: 8081
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET}
      TWILIO_API_AUTH_TOKEN: ${TWILIO_API_AUTH_TOKEN}
      DEMO_TOWN_ID: ${DEMO_TOWN_ID:-}
    ports:
      - '8081:8081'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8081/docs').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_TOWNS_SERVICE_URL: ${NEXT_PUBLIC_TOWNS_SERVICE_URL:-http://localhost:8081}
    depends_on:
      townservice:
        condition: service_healthy
    environment:
      PORT: 3000
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
