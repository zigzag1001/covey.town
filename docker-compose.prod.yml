services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  townservice:
    image: ghcr.io/zigzag1001/covey-town-townservice:latest
    environment:
      PORT: 8081
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET}
      TWILIO_API_AUTH_TOKEN: ${TWILIO_API_AUTH_TOKEN}
      DEMO_TOWN_ID: ${DEMO_TOWN_ID:-}
    ports:
      - "8081"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8081/docs').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
      
  frontend:
    image: ghcr.io/zigzag1001/covey-town-frontend:latest
    expose:
      - "3000"
    depends_on:
      townservice:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
